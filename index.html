:root{
  --bg:#FBF8F5;--bg2:#F5F0EB;--card:#FFFFFF;--ink:#3E3936;--ink2:#6E655F;--ink3:#8A817A;
  --line:#ECE5DE;--line2:#DDD5CD;--shadow:0 1px 2px rgba(80,60,50,.05),0 8px 24px rgba(80,60,50,.06);
  --pale:#F1E2DF;--mid:#E5CDC8;--deep:#B58A84;--hero:#8F605B;--hero2:#A3716B;--onhero:#FFFFFF;
  --ok:#4F7A57;--okbg:#E4EDE5;--warn:#8A6420;--warnbg:#F6ECD9;--bad:#A3473C;--badbg:#F5E1DD;
  --c1:#E7B9B2;--c2:#C6B6DE;--c3:#A9C6DF;--c4:#B5D3B9;--c5:#E8D2A9;--c6:#D9B5C9;--c7:#B9D6D3;--c8:#D6C3B0;
  --r:18px;--r2:12px;--fs:16px;--serif:"Bodoni",Georgia,"Times New Roman",serif;--sans:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[data-theme="Lavender"]{--pale:#ECE6F2;--mid:#DAD0E8;--deep:#9A8BB5;--hero:#6E5F8E;--hero2:#7F6F9F}
[data-theme="Sky"]{--pale:#E3EDF5;--mid:#CDDDEC;--deep:#7E9CB7;--hero:#53718D;--hero2:#62819D}
[data-theme="Sage"]{--pale:#E4EDE5;--mid:#CEDFD0;--deep:#83A388;--hero:#56765B;--hero2:#64866A}
[data-theme="Sand"]{--pale:#EFE6DC;--mid:#E0D2C3;--deep:#A58C74;--hero:#7D6550;--hero2:#8D745E}
[data-theme="Stone"]{--pale:#ECE9E6;--mid:#DAD5D0;--deep:#8E8680;--hero:#625B56;--hero2:#726A64}
html[data-dark="1"]{
  --bg:#1C1A19;--bg2:#232120;--card:#2A2726;--ink:#F2EDE9;--ink2:#B9B0AA;--ink3:#857C76;--line:#38332F;--line2:#4A443F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--okbg:#2C3A2E;--warnbg:#3E3424;--badbg:#45302C;
  --ok:#9CC4A3;--warn:#E0B66C;--bad:#E39A90;color-scheme:dark;
}
/* the theme sits on <body>, so the dark tints must be set on body too, or the light theme tints win and text turns unreadable */
html[data-dark="1"] body[data-theme],html[data-dark="1"]{--pale:color-mix(in srgb,var(--deep) 26%,#2A2726);--mid:color-mix(in srgb,var(--deep) 45%,#2A2726)}
html[data-big="1"]{--fs:18.5px}
html[data-calm="1"] *{transition:none!important;animation:none!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:1.45}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:-.01em}
h1{font-size:2.05em;line-height:1.1}
h2{font-size:1.35em;line-height:1.2}
h3{font-size:1.08em}
.caps{font-size:.72em;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);font-weight:500}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}.small{font-size:.86em}.tiny{font-size:.76em}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}
.hidden{display:none!important}

/* ------------------------------------------------ layout */
.app{display:flex;min-height:100vh;min-height:100dvh}
.side{width:248px;flex:none;padding:26px 16px 20px;border-right:1px solid var(--line);background:var(--bg2);position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;gap:10px;align-items:center;padding:0 10px 18px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--hero);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:20px}
.brand b{font-family:var(--serif);font-weight:500;font-size:1.15em;display:block;line-height:1.1}
.brand span{font-size:.72em;color:var(--ink2);letter-spacing:.06em}
.navlabel{padding:14px 12px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;color:var(--ink);text-decoration:none;font-size:.95em;border:0;background:none;width:100%;text-align:left}
.nav svg{width:19px;height:19px;flex:none;color:var(--ink2)}
.nav:hover{background:color-mix(in srgb,var(--pale) 60%,transparent)}
.nav.on{background:var(--card);box-shadow:var(--shadow);font-weight:500}
.nav.on svg{color:var(--hero)}
.nav .badge{margin-left:auto}
.side .addbtn{margin:4px 0 8px}
.main{flex:1;min-width:0;padding:30px 38px 120px;max-width:1180px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
.topbar .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}.row.sb{justify-content:space-between}.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.tabbar{display:none}

/* ------------------------------------------------ cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;border:1px solid color-mix(in srgb,var(--line) 70%,transparent);min-width:0}
.card.flat{box-shadow:none}
.card.tint{background:var(--pale);border-color:transparent;box-shadow:none}
.card h2+.sub,.card h3+.sub{margin-top:3px}
.sub{color:var(--ink2);font-size:.88em}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.stat{border-radius:14px;padding:12px 14px;background:var(--bg2)}
.stat .caps{font-size:.64em;display:block;margin-bottom:3px}

<script>window.HAVEN_DEMO=true;window.HAVEN_SHOP="https://www.etsy.com/shop/TrueHavenStudios";window.HAVEN_VERSION="1.0.0";</script>
<script>/* Haven engine: dates, recurrence, safe-to-spend, look-ahead, debt, goals. No DOM. */
const E = (() => {
  // ------------------------------------------------------------ dates (local, 'YYYY-MM-DD')
  const pad = n => String(n).padStart(2, "0");
  const ds = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const pd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
  const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
  const diff = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);           // days from a to b
  const dim = (y, m) => new Date(y, m + 1, 0).getDate();                 // m 0-based
  const ym = s => s.slice(0, 7);
  const addMonths = (s, n, day) => {
    const d = pd(s); const y = d.getFullYear(), m = d.getMonth() + n;
    const yy = y + Math.floor(m / 12), mm = ((m % 12) + 12) % 12;
    return `${yy}-${pad(mm + 1)}-${pad(Math.min(day || d.getDate(), dim(yy, mm)))}`;
  };
  const monthStart = s => s.slice(0, 8) + "01";
  const monthEnd = s => { const d = pd(s); return `${s.slice(0, 8)}${pad(dim(d.getFullYear(), d.getMonth()))}`; };
  const dow = s => pd(s).getDay();

  // ------------------------------------------------------------ recurrence
  // item: {start:'YYYY-MM-DD', freq:'once|weekly|biweekly|4weekly|semimonthly|monthly|quarterly|yearly', day2?:15, end?}
  function occ(it, from, to) {
    const out = [];
    if (!it || !it.start || from > to) return out;
    const end = it.end && it.end < to ? it.end : to;
    const f = it.freq || "monthly";
    const push = s => { if (s >= from && s <= end && s >= it.start && out[out.length - 1] !== s) out.push(s); };
    if (f === "once") { push(it.start); return out; }
    if (f === "weekly" || f === "biweekly" || f === "4weekly") {
      const step = f === "weekly" ? 7 : f === "biweekly" ? 14 : 28;
      let k = Math.max(0, Math.ceil(diff(it.start, from) / step));
      for (let s = addDays(it.start, k * step); s <= end; s = addDays(s, step)) push(s);
      return out;
    }
    if (f === "semimonthly") {
      const d1 = pd(it.start).getDate(), d2 = it.day2 || (d1 <= 15 ? d1 + 15 : d1 - 15);
      let cur = monthStart(from < it.start ? it.start : from);
      while (cur <= end) {
        const y = pd(cur).getFullYear(), m = pd(cur).getMonth(), L = dim(y, m);
        [...new Set([Math.min(d1, d2), Math.max(d1, d2)])].forEach(d => push(`${cur.slice(0, 8)}${pad(Math.min(d, L))}`));
        cur = addMonths(cur, 1, 1);
      }
      return out;
    }
    const step = f === "quarterly" ? 3 : f === "yearly" ? 12 : 1;
    const day = pd(it.start).getDate();
    const sm = pd(it.start), fm = pd(from);
    let k = Math.max(0, Math.floor(((fm.getFullYear() - sm.getFullYear()) * 12 + fm.getMonth() - sm.getMonth()) / step) - 1);
    for (let s = addMonths(it.start, k * step, day); s <= end; k++, s = addMonths(it.start, k * step, day)) push(s);
    return out;
  }
  const perMonth = it => ({ weekly: 52 / 12, biweekly: 26 / 12, "4weekly": 13 / 12, semimonthly: 2, monthly: 1, quarterly: 1 / 3, yearly: 1 / 12, once: 0 })[it.freq || "monthly"] * (+it.amount || 0);

  // ------------------------------------------------------------ bills incl. debt minimums
  function allBills(st) {
    const b = (st.bills || []).filter(x => !x.off);
    (st.debts || []).forEach(d => {
      if (d.min > 0 && d.balance > 0 && d.dueDay) b.push({ id: "debt:" + d.id, name: d.name, amount: +d.min, freq: "monthly", start: `2000-01-${pad(Math.min(31, d.dueDay))}`, added: d.added, kind: "debt", autopay: !!d.autopay, emoji: "💳" });
    });
    return b;
  }
  const key = (id, date) => id + "|" + date;
  // occurrences with status between from..to
  function billOcc(st, from, to) {
    const res = [];
    allBills(st).forEach(b => {
      occ(b, from, to).forEach(date => {
        const k = key(b.id, date), p = (st.paid || {})[k];
        res.push({ bill: b, date, key: k, paid: !!p, paidAt: p || null, auto: !!b.autopay });
      });
    });
    return res.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : b.bill.amount - a.bill.amount);
  }

  // ------------------------------------------------------------ income / paydays
  const mainIncome = st => (st.income || []).filter(x => !x.off).find(x => x.main) || (st.income || []).filter(x => !x.off)[0];
  function nextPayday(st, today) {
    const m = mainIncome(st);
    if (!m) return { date: addDays(monthEnd(today), 1), none: true };
    const o = occ(m, addDays(today, 1), addDays(today, 400));
    return o.length ? { date: o[0], income: m } : { date: addDays(monthEnd(today), 1), none: true };
  }
  function lastPayday(st, today) {
    const m = mainIncome(st); if (!m) return monthStart(today);
    const o = occ(m, addDays(today, -400), today);
    return o.length ? o[o.length - 1] : monthStart(today);
  }
  function payOcc(st, from, to) {
    const r = [];
    (st.income || []).filter(x => !x.off).forEach(i => occ(i, from, to).forEach(date => r.push({ inc: i, date, amount: +i.amount })));
    return r.sort((a, b) => a.date < b.date ? -1 : 1);
  }

  // ------------------------------------------------------------ the number

function ring(p, size = 74, stroke = 7, label = "", sub = "", light = true) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, pp = clamp(p, 0, 1);
  const bg = light ? "rgba(255,255,255,.22)" : "var(--bg2)", fg = light ? "#fff" : "var(--deep)";
  return `<svg class="ringsvg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="${bg}" stroke-width="${stroke}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="${fg}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c * pp} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/>${label ? `<text x="50%" y="${sub ? "47%" : "53%"}" text-anchor="middle" font-size="${size * .18}" font-weight="500" fill="${light ? "#fff" : "var(--ink)"}" font-family="Jost,sans-serif">${esc(label)}</text>` : ""}${sub ? `<text x="50%" y="66%" text-anchor="middle" font-size="${size * .12}" fill="${light ? "rgba(255,255,255,.8)" : "var(--ink2)"}" font-family="Jost,sans-serif">${esc(sub)}</text>` : ""}</svg>`;
}
function donut(parts, size = 150, stroke = 22) {
  const tot = parts.reduce((a, p) => a + p.v, 0) || 1, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  let off = 0, segs = "";
  parts.forEach(p => { const l = c * p.v / tot; segs += `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="${p.color}" stroke-width="${stroke}" stroke-dasharray="${Math.max(0, l - 2)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size / 2} ${size / 2})" fill="none"/>`; off += l; });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="var(--bg2)" stroke-width="${stroke}" fill="none"/>${segs}</svg>`;
}
function bars(vals, labels, h = 120, color = "var(--deep)", hiIdx = -1) {
  const max = Math.max(1, ...vals), w = 100 / vals.length;
  return `<svg viewBox="0 0 100 ${h / 3}" preserveAspectRatio="none" style="width:100%;height:${h}px">${vals.map((v, i) => { const bh = (h / 3 - 2) * v / max; return `<rect x="${i * w + w * .15}" y="${h / 3 - bh}" width="${w * .7}" height="${Math.max(bh, v ? .6 : .25)}" rx="${Math.min(1.2, w * .3)}" fill="${i === hiIdx ? "var(--hero)" : v ? color : "var(--line2)"}"/>`; }).join("")}</svg>` + (labels ? `<div class="row sb tiny faint" style="margin-top:4px">${labels.map(l => `<span>${l}</span>`).join("")}</div>` : "");
}

function applyTheme() {

  document.body.setAttribute("data-theme", st.theme);

  root.setAttribute("data-dark", dark ? "1" : "0");

}

let modalStack = [];

let toastT = null;
function toast(msg, undo) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast";
  t.innerHTML = `<span>${msg}</span>${undo ? '<button>Undo</button>' : ""}`;
  if (undo) t.querySelector("button").onclick = () => { undo(); t.remove(); };

}

  else if (over.length) { const o = over[0]; ico = "bill"; title = `Did ${esc(o.bill.name)} go out?`; txt = `It was due ${rel(o.date)} (${fmt(o.bill.amount)}). Tick it so your number stays right.`; btn = `<button class="btn pri sm" data-act="pay" data-k="${esc(o.key)}">Yes, it's paid</button><button class="btn sm" href="#/bills" data-act="goto" data-r="bills">See bills</button>`; }
  else if (s.fresh === "old" && !soon.length) { ico = "wallet"; title = "Quick balance check?"; txt = `It's been ${s.age} days. No catching up needed – tick any bills that went out, then tell Haven today's balance.`; btn = `<button class="btn pri sm" data-act="minute">Start the money minute</button>`; }
  else if (remDue().length) { const r = remDue()[0], T = RT[r.type] || RT.other, d = E.diff(t, r.date); ico = "bell"; title = `${T[1]}: ${esc(r.name)}`; txt = `${d < 0 ? "Was due " + rel(r.date) : "Due " + rel(r.date)}${r.amount ? " · " + fmt(r.amount) : ""}. Sort it now and it's off your mind.`; btn = `<button class="btn pri sm" data-act="remDone" data-id="${r.id}">${T[2]}</button><button class="btn sm" data-act="goto" data-r="remember">Open list</button>`; }
  else if (ready.length) { ico = "pause"; title = `Still want ${esc(ready[0].name)}?`; txt = `The cool-off is over. Decide now – both answers are fine.`; btn = `<button class="btn pri sm" data-act="goto" data-r="wish">Decide</button>`; }
  else if (!DEMO && S.expenses.length >= 15 && (!S.lastBackup || E.diff(S.lastBackup, t) > 30)) { ico = "down"; title = "Time for a little backup"; txt = "Your data lives only on this device. One tap saves a copy you can keep in Files, Drive or your email."; btn = `<button class="btn pri sm" data-act="backup">Download backup</button>`; }
  else if (cancelSoon().length) { const b = cancelSoon()[0], d = E.diff(t, b.cancelBy); ico = "bell"; title = `Cancel ${esc(b.name)} by ${d === 0 ? "today" : dshort(b.cancelBy)}?`; txt = `Your cancel-by date is ${d === 0 ? "today" : "in " + d + " day" + (d > 1 ? "s" : "")}. Still using it? Then you're fine – if not, cancel now.`; btn = `<button class="btn pri sm" data-act="goto" data-r="subs">Open subscriptions</button>`; }
  else if (soon.length) { ico = "bell"; title = `${esc(soon[0].bill.name)} is due ${rel(soon[0].date)}`; txt = `${fmt(soon[0].bill.amount)} – already held back from your number. Tick it once it's paid.`; btn = `<button class="btn sm" data-act="pay" data-k="${esc(soon[0].key)}">Mark paid</button>`; }
  return `<div class="card next" style="order:2"><div class="ico">${ic(ico)}</div><div class="grow"><div class="caps" style="margin-bottom:3px">One thing right now</div><h3>${title}</h3><div class="sub" style="margin-top:3px">${txt}</div>${btn ? `<div class="row wrap" style="margin-top:12px">${btn}</div>` : ""}</div></div>`;
}
function minuteCard() {
  const t = today(), m = S.minute[t] || {};
  const steps = [["bills", "Tick bills that went out"], ["bal", "Check your balance"], ["spend", "Log today's spending"]];
  const n = steps.filter(x => m[x[0]]).length;
  return `<div class="card" style="order:4"><div class="cardhead"><div><h2>Money minute</h2><div class="sub">Three tiny steps. About 60 seconds.</div></div>${ring(n / 3, 46, 5, n + "/3", "", false)}</div>
  <div class="list">${steps.map(([k, l]) => `<div class="item"><button class="check ${m[k] ? "on" : ""}" data-act="minuteTick" data-k="${k}" aria-label="${l}">${ic("check")}</button><span class="grow ${m[k] ? "done" : ""}">${l}</span>${m[k] ? "" : `<button class="link" data-act="minuteGo" data-k="${k}">Do it</button>`}</div>`).join("")}</div>
  ${n === 3 ? `<div class="sub" style="margin-top:8px">All three done. That counts. 💛</div>` : ""}</div>`;
}
function headsUp() {
  const t = today(), la = E.lookAhead(S, t, 3);
  if (!la.length) return "";
  const short = la.find(p => p.net < 0);
  const held = S.holds.filter(h => h.until > t);
  const rows = la.map(p => `<div class="item"><div class="grow"><b class="small">${dshort(p.from)} – ${dshort(p.to)}</b><div class="tiny muted">pay ${fmt0(p.inn)} · bills ${fmt0(p.out)}</div></div><span class="badge ${p.net < 0 ? "bad" : "ok"}">${p.net < 0 ? "short " + fmt0(-p.net) : "covered +" + fmt0(p.net)}</span></div>`).join("");
  if (short && !held.some(h => h.from === short.from)) {
    return `<div class="card" style="border-left:4px solid var(--warn);order:6"><div class="caps" style="color:var(--warn)">Heads-up</div><h3 style="margin:4px 0 4px">Bills from ${dshort(short.from)} need ${fmt(-short.net)} more than that pay brings in.</h3><div class="sub">Set it aside now and Haven keeps it out of your daily number until then.</div><div class="row wrap" style="margin:12px 0 4px"><button class="btn pri sm" data-act="hold" data-from="${short.from}" data-amt="${-short.net}">Set ${fmt0(-short.net)} aside for me</button></div><div class="list" style="margin-top:6px">${rows}</div></div>`;
  }
  return `<div class="card" style="order:6"><div class="cardhead"><h2>Looking ahead</h2>${held.length ? `<span class="badge">${fmt0(held.reduce((a, h) => a + h.amount, 0))} set aside</span>` : `<span class="badge ok">You're covered</span>`}</div><div class="list">${rows}</div>${held.length ? `<div class="row" style="margin-top:8px"><button class="link" data-act="unhold">Stop setting money aside</button></div>` : ""}</div>`;
}
function goalsMini() {
  if (!S.goals.length) return "";
  return `<div class="card" style="order:7"><div class="cardhead"><h2>Saving up for</h2><a class="link" href="#/goals">All goals</a></div>${S.goals.slice(0, 3).map(g => `<div style="margin:10px 0"><div class="row sb small"><span>${g.emoji || "🌟"} ${esc(g.name)}</span><span class="num muted">${fmt0(g.saved)} / ${fmt0(g.target)}</span></div><div class="bar" style="margin-top:6px"><i style="width:${clamp(g.saved / g.target, 0, 1) * 100}%"></i></div></div>`).join("")}</div>`;
}
function billRow(o, compact) {
  const t = today(), late = o.date < t && !o.paid && !o.auto, d = E.diff(t, o.date);
  const cls = o.paid || (o.auto && o.date <= t) ? "ok" : late ? "bad" : d <= 3 ? "warn" : "";
  const status = o.paid ? `<span class="badge ok">paid</span>` : o.auto && o.date <= t ? `<span class="badge ok">autopay</span>` : late ? `<span class="badge bad">overdue</span>` : `<span class="badge ${d <= 3 ? "warn" : ""}">${d === 0 ? "due today" : d === 1 ? "due tomorrow" : "due " + rel(o.date)}</span>`;
  const isDebt = o.bill.id.startsWith("debt:");
  return `<div class="item">${dateBox(o.date, cls)}<div class="grow"><b class="${o.paid ? "done" : ""}">${o.bill.emoji ? o.bill.emoji + " " : ""}${esc(o.bill.name)}</b><div class="row wrap tiny muted" style="gap:6px;margin-top:2px">${status}<span>${FREQ[o.bill.freq] || ""}${o.bill.autopay ? " · autopay" : ""}</span></div></div><span class="amt">${fmt(o.bill.amount)}</span>
   <button class="check ${o.paid ? "on" : ""}" data-act="pay" data-k="${esc(o.key)}" aria-label="Mark paid">${ic("check")}</button>${compact || isDebt ? "" : `<button class="iconbtn" data-act="editBill" data-id="${o.bill.id}" aria-label="Edit ${esc(o.bill.name)}">${ic("edit")}</button>`}</div>`;
}
function expRow(e) {
  const c = catOf(e.cat);
  return `<div class="item"><div class="emo" style="background:color-mix(in srgb,${c.color} 45%,var(--card))">${c.emoji}</div><div class="grow"><b>${esc(e.note || c.name)}</b><div class="tiny muted">${esc(c.name)}${e.date !== today() ? " · " + dshort(e.date) : ""}</div></div><span class="amt">${e.amount < 0 ? "+" + fmt(-e.amount) : fmt(e.amount)}</span><button class="iconbtn" data-act="editExp" data-id="${e.id}" aria-label="Edit ${esc(e.note || c.name)}">${ic("edit")}</button></div>`;
}

// =========================================================== MONTH
function vMonth() {
  const t = today(), m = viewState.month || E.monthStart(t), d0 = E.pd(m);
  const first = E.monthStart(m), last = E.monthEnd(m);
  const ws = S.settings.weekStart, lead = (E.dow(first) - ws + 7) % 7;
  const start = E.addDays(first, -lead), cells = Math.ceil((lead + E.diff(first, last) + 1) / 7) * 7;
  const bills = E.billOcc(S, start, E.addDays(start, cells)), pays = E.payOcc(S, start, E.addDays(start, cells));
  const spentBy = {}; S.expenses.forEach(e => { if (+e.amount > 0) spentBy[e.date] = (spentBy[e.date] || 0) + (+e.amount); });
  let html = "";
  for (let i = 0; i < 7; i++) html += `<div class="dow">${DOW[(i + ws) % 7]}</div>`;
  for (let i = 0; i < cells; i++) {
    const day = E.addDays(start, i), out = E.ym(day) !== E.ym(m);
    const evs = [...pays.filter(p => p.date === day).map(p => `<div class="ev pay">${esc(p.inc.name)}</div>`), ...bills.filter(b => b.date === day).map(b => `<div class="ev ${b.paid || (b.auto && day <= t) ? "paid" : ""}">${esc(b.bill.name)}</div>`)];
    if (spentBy[day]) evs.push(`<div class="ev spend num"><span class="sw">spent </span>${fmt0(spentBy[day])}</div>`);
    html += `<div class="cday ${out ? "out" : ""} ${day === t ? "today" : ""}" data-act="day" data-d="${day}"><div class="d"><span>${E.pd(day).getDate()}</span>${S.nospend[day] ? '<span class="star">★</span>' : ""}</div>${evs.slice(0, 3).join("")}${evs.length > 3 ? `<div class="tiny faint">+${evs.length - 3}</div>` : ""}</div>`;
  }
  const inMonth = d => d >= first && d <= last;
  const spent = S.expenses.filter(e => inMonth(e.date)).reduce((a, e) => a + (+e.amount), 0);
  const inc = pays.filter(p => inMonth(p.date)).reduce((a, p) => a + p.amount, 0) + S.moneyIn.filter(x => inMonth(x.date) && !x.transfer).reduce((a, x) => a + (+x.amount), 0);
  const bsum = bills.filter(b => inMonth(b.date)).reduce((a, b) => a + (+b.bill.amount), 0);
  const ns = Object.keys(S.nospend).filter(d => S.nospend[d] && inMonth(d)).length;
  return pageTop(`${MONTHS[d0.getMonth()]} ${d0.getFullYear()}`, "The month", `<div class="seg"><button data-act="mon" data-n="-1" aria-label="Previous month">${ic("left").replace("<svg", '<svg width="16" height="16"')}</button><button data-act="mon" data-n="0" class="${E.ym(m) === E.ym(t) ? "on" : ""}">Today</button><button data-act="mon" data-n="1" aria-label="Next month">${ic("right").replace("<svg", '<svg width="16" height="16"')}</button></div>`)
    + `<div class="stats" style="margin-bottom:18px"><div class="stat ok"><span class="caps">Money in</span><b class="num">${fmt0(inc)}</b></div><div class="stat"><span class="caps">Bills</span><b class="num">${fmt0(bsum)}</b></div><div class="stat p"><span class="caps">Everyday spending</span><b class="num">${fmt0(spent)}</b></div><div class="stat warn"><span class="caps">No-spend days</span><b>${ns} ★</b></div></div>
    <div class="card"><div class="cal">${html}</div><div class="row wrap tiny muted" style="margin-top:12px;gap:14px"><span><span class="dot" style="background:var(--ok)"></span> payday</span><span><span class="dot" style="background:var(--deep)"></span> bill</span><span>★ no-spend day</span><span>Tap a day to see or add things.</span></div></div>`;
}

// =========================================================== BILLS
function vBills() {
  const t = today(), s = E.safe(S, t, now());
  const occ = E.billOcc(S, E.addDays(t, -31), E.addDays(t, 31)).filter(o => !(o.bill.added && o.date < o.bill.added)).filter(o => o.date >= t || (!o.paid && !o.auto) || (o.paid && E.diff(o.date, t) <= 7));
  const paidMonth = E.billOcc(S, E.monthStart(t), t).filter(o => o.paid || o.auto).reduce((a, o) => a + (+o.bill.amount), 0);
  const allB = E.allBills(S), monthly = allB.reduce((a, b) => a + E.perMonth(b), 0);
  const subs = S.bills.filter(b => b.kind === "sub" && !b.off), subM = subs.reduce((a, b) => a + E.perMonth(b), 0);
  const maxSub = Math.max(1, ...subs.map(b => E.perMonth(b) * 12));
  const waiting = s.dueList.filter(o => o.date < t).length;
  return pageTop("Every bill, in one place", "Bills", `<button class="btn" data-act="detective">🔎 Find forgotten subscriptions</button><button class="btn hide-m" data-act="ics">${ic("cal")} Add to my calendar</button><button class="btn pri" data-act="newBill">${ic("plus")} Add a bill</button>`)
    + `<div class="stats" style="margin-bottom:18px"><div class="stat warn"><span class="caps">Before your next payday</span><b class="num">${fmt(s.due)}</b></div><div class="stat ${waiting ? "bad" : ""}"><span class="caps">Waiting to be ticked</span><b>${waiting}</b></div><div class="stat ok"><span class="caps">Next payday</span><b>${s.payday.none ? "–" : dshort(s.until)}</b></div><div class="stat p"><span class="caps">Paid this month</span><b class="num">${fmt0(paidMonth)}</b></div></div>
    <div class="grid g2"><div class="col"><div class="card"><div class="cardhead"><h2>Soonest first</h2><span class="tiny muted">next 31 days</span></div>${occ.length ? `<div class="list">${occ.map(o => billRow(o)).join("")}</div>` : `<div class="empty">No bills yet. Add rent, phone, streaming… once, and Haven repeats them for you.</div>`}</div></div>
    <div class="col"><div class="card"><div class="cardhead"><h2>All your bills</h2><span class="muted small">${fmt0(monthly)} / month</span></div>${allB.length ? `<div class="list">${allB.map(b => `<div class="item"><div class="emo">${b.emoji || "🧾"}</div><div class="grow"><b>${esc(b.name)}</b><div class="tiny muted">${FREQ[b.freq]}${b.kind === "debt" ? " · debt minimum" : b.kind === "sub" ? " · subscription" : b.kind === "save" ? " · savings transfer" : ""}</div></div><span class="amt">${fmt(b.amount)}</span>${b.kind === "debt" ? "" : `<button class="iconbtn" data-act="editBill" data-id="${b.id}" aria-label="Edit ${esc(b.name)}">${ic("edit")}</button>`}</div>`).join("")}</div>` : `<div class="empty">Nothing here yet.</div>`}</div>
    <div class="card"><div class="cardhead"><h2>Subscription radar</h2><span class="badge">${subs.length} subscriptions</span></div><div class="stats" style="margin-bottom:12px"><div class="stat p"><span class="caps">A month</span><b class="num">${fmt(subM)}</b></div><div class="stat ok"><span class="caps">A year</span><b class="num">${fmt(subM * 12)}</b></div></div>
    ${subs.length ? subs.map(b => `<div style="margin:9px 0"><div class="row sb small"><span>${b.emoji || "📺"} ${esc(b.name)}</span><span class="num muted">${fmt(E.perMonth(b) * 12)} a year</span></div><div class="bar" style="margin-top:5px"><i style="width:${E.perMonth(b) * 12 / maxSub * 100}%;background:var(--c6)"></i></div></div>`).join("") + `<div class="row" style="margin-top:10px"><button class="link" data-act="goto" data-r="subs">Open all subscriptions →</button></div>` : `<div class="sub">Mark a bill as “subscription” to see it here.</div>`}</div></div></div>`;
}

// =========================================================== SPENDING
function vSpending() {
  const t = today(), m = viewState.spendMonth || E.monthStart(t), first = E.monthStart(m), last = E.monthEnd(m), d0 = E.pd(m);
  const tx = S.expenses.filter(e => e.date >= first && e.date <= last).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.ts - a.ts);
  const by = {}; tx.forEach(e => by[e.cat] = (by[e.cat] || 0) + (+e.amount));
  const total = tx.reduce((a, e) => a + (+e.amount), 0);
  const elapsed = E.ym(m) === E.ym(t) ? E.diff(first, t) + 1 : E.diff(first, last) + 1, mdays = E.diff(first, last) + 1;
  const cats = S.cats.filter(c => c.budget > 0 || by[c.id]).map(c => ({ c, v: by[c.id] || 0 }));
  const parts = S.cats.map(c => ({ v: Math.max(0, by[c.id] || 0), color: c.color, name: c.name, emoji: c.emoji })).filter(p => p.v > 0).sort((a, b) => b.v - a.v);
  const ptot = parts.reduce((a, p) => a + p.v, 0) || 1;
  let groups = "", lastD = "";
  tx.forEach(e => { if (e.date !== lastD) { groups += `<div class="caps" style="margin:14px 0 2px">${dlong(e.date)}</div>`; lastD = e.date; } groups += expRow(e); });
  return pageTop("Where it went", "Spending", `<div class="seg"><button data-act="smon" data-n="-1" aria-label="Previous month">${ic("left").replace("<svg", '<svg width="16" height="16"')}</button><button class="on">${MON[d0.getMonth()]} ${d0.getFullYear()}</button><button data-act="smon" data-n="1" aria-label="Next month">${ic("right").replace("<svg", '<svg width="16" height="16"')}</button></div><button class="btn pri" data-act="add">${ic("plus")} Log a spend</button>`)
    + `<div class="grid g2"><div class="col"><div class="card"><div class="cardhead"><h2>Categories</h2><button class="link" data-act="cats">Edit categories</button></div>
    ${cats.length ? cats.map(({ c, v }) => { const p = c.budget ? v / c.budget : 0, pace = c.budget ? c.budget * elapsed / mdays : 0; return `<div style="margin:12px 0"><div class="row sb"><span>${c.emoji} ${esc(c.name)}</span><span class="num small">${fmt0(v)}${c.budget ? ` <span class="muted">/ ${fmt0(c.budget)}</span>` : ""}</span></div>${c.budget ? `<div class="bar ${p > 1 ? "over" : ""}" style="margin-top:6px"><i style="width:${clamp(p, 0, 1) * 100}%;${p > 1 ? "" : `background:${c.color}`}"></i></div><div class="tiny muted" style="margin-top:3px">${p > 1 ? `${fmt0(v - c.budget)} over – no stress, just good to know` : v > pace * 1.15 && elapsed < mdays ? `a bit ahead of pace · ${fmt0(c.budget - v)} left` : `${fmt0(c.budget - v)} left`}</div>` : ""}</div>`; }).join("") : `<div class="empty">No spending this month yet.</div>`}</div></div>
    <div class="col"><div class="card"><div class="cardhead"><h2>This month</h2><span class="num">${fmt(total)}</span></div>${parts.length ? `<div class="row" style="gap:18px;align-items:center;flex-wrap:wrap">${donut(parts, 150, 22)}<div class="legend grow">${parts.slice(0, 7).map(p => `<div><span class="dot" style="background:${p.color}"></span><span class="grow">${p.emoji} ${esc(p.name)}</span><span class="num muted">${Math.round(p.v / ptot * 100)}%</span></div>`).join("")}</div></div>` : `<div class="empty">Your chart appears after your first spend.</div>`}</div>
    <div class="card"><div class="cardhead"><h2>Every spend</h2><span class="tiny muted">${tx.length} entries</span></div>${tx.length ? `<div class="list">${groups}</div>` : `<div class="empty">Nothing logged in ${MONTHS[d0.getMonth()]}.</div>`}</div></div></div>`;
}

// =========================================================== PAYCHECKS
function vPay() {
  const t = today(), la = E.lookAhead(S, t, 3), m = E.mainIncome(S);
  const pays = E.payOcc(S, t, E.addDays(t, 60)).slice(0, 6);
  const periods = la.map(p => { const bills = E.billOcc(S, p.from, p.to).filter(o => !o.paid); return { ...p, bills }; });
  return pageTop("Budget by paycheck", "Paychecks", `<button class="btn" data-act="moneyIn">${ic("down")} Extra money in</button><button class="btn pri" data-act="newIncome">${ic("plus")} Add income</button>`)
    + `<div class="grid g2"><div class="col"><div class="card"><div class="cardhead"><h2>What each paycheck covers</h2></div>${periods.length ? periods.map(p => `<div style="border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px"><div class="row sb"><b>${dshort(p.from)} – ${dshort(p.to)}</b><span class="badge ${p.net < 0 ? "bad" : "ok"}">${p.net < 0 ? "short " + fmt0(-p.net) : fmt0(p.net) + " left"}</span></div><div class="row sb small muted" style="margin:6px 0 8px"><span>Pay in ${fmt(p.inn)}</span><span>Bills ${fmt(p.out)}</span></div><div class="bar thick ${p.net < 0 ? "over" : "ok"}"><i style="width:${clamp(p.out / Math.max(1, p.inn), 0, 1) * 100}%"></i></div>${p.bills.length ? `<div class="row wrap" style="gap:6px;margin-top:10px">${p.bills.map(o => `<span class="badge">${dshort(o.date)} · ${esc(o.bill.name)} ${fmt0(o.bill.amount)}</span>`).join("")}</div>` : ""}</div>`).join("") : `<div class="empty">Add your paycheck and Haven shows which bills each one has to cover.</div>`}</div></div>
    <div class="col"><div class="card"><div class="cardhead"><h2>Your income</h2></div>${S.income.length ? `<div class="list">${S.income.map(i => `<div class="item"><div class="emo">💰</div><div class="grow"><b>${esc(i.name)}</b> ${i === m ? '<span class="badge">main payday</span>' : ""}<div class="tiny muted">${FREQ[i.freq]} · next ${(E.occ(i, E.addDays(t, 1), E.addDays(t, 400))[0] && dshort(E.occ(i, E.addDays(t, 1), E.addDays(t, 400))[0])) || "–"}</div></div><span class="amt">${fmt(i.amount)}</span><button class="iconbtn" data-act="editIncome" data-id="${i.id}" aria-label="Edit ${esc(i.name)}">${ic("edit")}</button></div>`).join("")}</div>` : `<div class="empty">No income yet.</div>`}</div>
    <div class="card"><div class="cardhead"><h2>Next paydays</h2></div>${pays.length ? `<div class="list">${pays.map(p => `<div class="item">${dateBox(p.date, "ok")}<div class="grow">${esc(p.inc.name)}<div class="tiny muted">${rel(p.date)}</div></div><span class="amt" style="color:var(--ok)">+${fmt(p.amount)}</span></div>`).join("")}</div>` : `<div class="empty">–</div>`}</div>
    ${S.moneyIn.some(x => x.transfer) ? `<div class="card"><div class="cardhead"><h2>Moved to & from goals</h2><span class="tiny muted">tap 🗑 to undo</span></div><div class="list">${S.moneyIn.filter(x => x.transfer).slice().sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 8).map(x => `<div class="item">${dateBox(x.date)}<div class="grow">${esc(x.name)}</div><span class="amt">${x.amount < 0 ? "−" + fmt(-x.amount) : "+" + fmt(x.amount)}</span><button class="iconbtn" data-act="undoMove" data-id="${x.id}" aria-label="Undo ${esc(x.name)}">${ic("trash")}</button></div>`).join("")}</div></div>` : ""}
    <div class="card"><div class="cardhead"><h2>Extra money in</h2><span class="tiny muted">refunds, side jobs, gifts</span></div>${S.moneyIn.some(x => !x.transfer) ? `<div class="list">${S.moneyIn.filter(x => !x.transfer).slice().sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 8).map(x => `<div class="item">${dateBox(x.date, "ok")}<div class="grow">${esc(x.name)}</div><span class="amt" style="color:var(--ok)">+${fmt(x.amount)}</span><button class="iconbtn" data-act="delIn" data-id="${x.id}" aria-label="Delete ${esc(x.name)}">${ic("trash")}</button></div>`).join("")}</div>` : `<div class="empty">Got money outside your paycheck? Log it here and your number grows.</div>`}</div></div></div>`;
}

// =========================================================== GOALS & CHALLENGES
function vGoals() {
  const t = today();
  const put = S.goals.reduce((a, g) => a + (+g.saved), 0), need = S.goals.reduce((a, g) => a + Math.max(0, g.target - g.saved), 0);
  const goals = S.goals.map(g => { const p = E.goalPace(g, t); const pct = g.target ? g.saved / g.target : 0; const plus = p.monthly > 0 ? E.goalPace({ ...g, monthly: p.monthly + 25 }, t) : null;
    return `<div class="card"><div class="row top" style="gap:14px">${ring(pct, 64, 6, Math.round(pct * 100) + "%", "", false)}<div class="grow"><div class="row sb"><h3>${g.emoji || "🌟"} ${esc(g.name)}</h3><button class="iconbtn" data-act="editGoal" data-id="${g.id}" aria-label="Edit ${esc(g.name)}">${ic("edit")}</button></div><div class="num" style="margin-top:2px"><b>${fmt(g.saved)}</b> <span class="muted">of ${fmt(g.target)}</span></div>
    <div class="tiny muted" style="margin-top:6px">${pct >= 1 ? "Done! 🎉" : p.months === Infinity ? "Add money to see your finish date." : `At your pace (${fmt0(p.monthly)}/month): about ${p.months} month${p.months > 1 ? "s" : ""} · ${p.finish ? MON[E.pd(p.finish).getMonth()] + " " + E.pd(p.finish).getFullYear() : ""}`}${g.by && pct < 1 ? ` · ${fmt0(p.perMonthToDate)}/month to reach it by ${dshort(g.by)}` : ""}</div>
    ${plus && pct < 1 && plus.months < p.months ? `<div class="tiny" style="margin-top:4px;color:var(--ok)">+${fmt0(25)} a month → ${plus.months} months instead of ${p.months}</div>` : ""}
    <div class="row wrap" style="margin-top:12px;gap:8px"><button class="btn pri sm" data-act="goalAdd" data-id="${g.id}">Add money</button><button class="btn sm" data-act="goalTake" data-id="${g.id}">Take out</button></div></div></div></div>`; }).join("");
  const ch = S.challenges.map(c => {
    const vals = chalVals(c), done = c.done || {}, n = Object.keys(done).filter(k => done[k]).length, tot = vals.reduce((a, v) => a + v, 0), got = vals.reduce((a, v, i) => a + (done[i] ? v : 0), 0);
    return `<div class="card"><div class="cardhead"><div><h2>${esc(c.name)}</h2><div class="sub">${n} of ${vals.length} filled · ${fmt0(got)} of ${fmt0(tot)}</div></div>${ring(got / tot, 58, 6, Math.round(got / tot * 100) + "%", "", false)}</div>
    <div class="row wrap" style="gap:8px;margin-bottom:12px"><button class="btn sm" data-act="chalPick" data-id="${c.id}">🎲 Pick one for me</button><button class="btn sm" data-act="chalPrint" data-id="${c.id}">Print it</button><button class="btn sm danger" data-act="chalDel" data-id="${c.id}">Remove</button></div>
    <div class="chal">${vals.map((v, i) => `<button class="${done[i] ? "on" : ""}" data-act="chalTick" data-id="${c.id}" data-i="${i}">${done[i] ? "✓ " : ""}${fmt0(v).replace(/\.00$/, "")}</button>`).join("")}</div><div class="sub" style="margin-top:12px">Any order, any pace. There are no streaks to break here.</div></div>`;
  }).join("");
  return pageTop("Goals that grow", "Goals & challenges", `<button class="btn" data-act="newChal">${ic("star")} Start a challenge</button><button class="btn pri" data-act="newGoal">${ic("plus")} New goal</button>`)
    + `<div class="stats" style="margin-bottom:18px"><div class="stat ok"><span class="caps">Put away</span><b class="num">${fmt0(put)}</b></div><div class="stat p"><span class="caps">Still to find</span><b class="num">${fmt0(need)}</b></div><div class="stat"><span class="caps">Goals</span><b>${S.goals.length}</b></div><div class="stat warn"><span class="caps">Kept by waiting</span><b class="num">${fmt0(S.kept)}</b></div></div>
    <div class="grid g2"><div class="col">${goals || `<div class="card"><div class="empty">Emergency cushion, a trip, a new laptop… add your first goal and see when you'll get there.</div></div>`}</div><div class="col">${ch || `<div class="card"><h2>Savings challenges</h2><div class="sub" style="margin:6px 0 14px">Tap a box whenever you put that amount away. Fun, visual, forgiving.</div><div class="row wrap" style="gap:8px"><button class="btn soft" data-act="newChal" data-type="52">52-week challenge</button><button class="btn soft" data-act="newChal" data-type="100">100 envelopes</button><button class="btn soft" data-act="newChal" data-type="26">26 paychecks</button></div></div>`}</div></div>`;
}
function chalVals(c) {
  const b = +c.base || 1;
  if (c.type === "100") return Array.from({ length: 100 }, (_, i) => (i + 1) * b);
  if (c.type === "26") return Array.from({ length: 26 }, (_, i) => (i + 1) * b * 5);
  if (c.type === "custom") return Array.from({ length: +c.count || 30 }, () => +c.each || 10);
  return Array.from({ length: 52 }, (_, i) => (i + 1) * b);
}

// =========================================================== DEBT
function vDebt() {
  const t = today(), D = S.debts.filter(d => d.balance > 0);
  const total = D.reduce((a, d) => a + (+d.balance), 0), mins = D.reduce((a, d) => a + (+d.min), 0);
  const orig = S.debts.reduce((a, d) => a + (+d.original || +d.balance), 0);
  if (viewState.extra === null) viewState.extra = +S.settings.debtExtra || 0;
  const ex = viewState.extra, meth = S.settings.debtMethod || "avalanche";
  const plan = E.debtPlan(D, ex, meth), base = E.debtPlan(D, 0, meth);
  const free = plan.months === Infinity ? null : E.addMonths(E.monthStart(t), plan.months);
  const maxEx = Math.max(250, Math.ceil(mins * 1.5 / 50) * 50);
  const sooner = base.months === Infinity || plan.months === Infinity ? 0 : base.months - plan.months, saved = base.interest === Infinity || plan.interest === Infinity ? 0 : base.interest - plan.interest;
  const list = plan.order.map((id, i) => { const d = S.debts.find(x => x.id === id), p = (+d.original || +d.balance) ? 1 - d.balance / (+d.original || +d.balance) : 0; const pm = plan.payoff[id];
    return `<div class="item" style="align-items:flex-start"><div class="emo">${i + 1}</div><div class="grow"><div class="row sb"><b>${esc(d.name)}</b><span class="amt">${fmt(d.balance)}</span></div><div class="bar" style="margin:7px 0 5px"><i style="width:${p * 100}%;background:var(--c${(i % 8) + 1})"></i></div><div class="row sb tiny muted"><span>${d.apr}% · ${fmt0(d.min)} a month${d.dueDay ? " · due the " + d.dueDay + "." : ""}</span><span>${pm ? "clear in " + pm + " month" + (pm > 1 ? "s" : "") : ""}</span></div></div><button class="iconbtn" data-act="editDebt" data-id="${d.id}" aria-label="Edit ${esc(d.name)}">${ic("edit")}</button></div>`; }).join("");
  const paidOff = S.debts.filter(d => d.balance <= 0);
  return pageTop("Pay it off, your way", "Debt payoff", `<button class="btn pri" data-act="newDebt">${ic("plus")} Add a debt</button>`)
    + (D.length ? `<div class="grid g2"><div class="col"><div class="card" style="text-align:center;padding:26px 22px"><div class="caps">Debt-free</div><div class="bigdate" style="margin:6px 0 4px">${free ? MONTHS[E.pd(free).getMonth()] + " " + E.pd(free).getFullYear() : "Not yet – raise the payment"}</div><div class="sub">${free ? `in ${plan.months} months · ${fmt0(total)} to go` : "The minimums don't cover the interest yet."}</div>
    <div style="max-width:420px;margin:20px auto 0;text-align:left"><div class="row sb"><span class="small">Extra each month</span><b class="num">${fmt(ex)}</b></div><input type="range" min="0" max="${maxEx}" step="5" value="${ex}" data-act="extra" style="margin-top:8px"><div class="row sb tiny faint"><span>${fmt0(0)}</span><span>${fmt0(maxEx)}</span></div></div>
    <div class="row wrap" style="justify-content:center;gap:8px;margin-top:14px">${sooner > 0 ? `<span class="badge ok">⏩ ${sooner} month${sooner > 1 ? "s" : ""} sooner</span>` : `<span class="badge">Slide to see what a little extra does</span>`}${saved > 0.5 ? `<span class="badge ok">💰 ${fmt(saved)} less interest</span>` : ""}</div>
    <div class="seg" style="margin-top:18px">${[["snowball", "❄️ Snowball"], ["avalanche", "🔥 Avalanche"], ["custom", "✋ My order"]].map(([k, l]) => `<button class="${meth === k ? "on" : ""}" data-act="method" data-m="${k}">${l}</button>`).join("")}</div><div class="tiny muted" style="margin-top:8px">${meth === "snowball" ? "Smallest balance first – quick wins." : meth === "avalanche" ? "Highest interest first – cheapest." : "Your own order – set it on each debt."}</div></div>
    <div class="stats"><div class="stat bad"><span class="caps">Still owed</span><b class="num">${fmt0(total)}</b></div><div class="stat"><span class="caps">Minimums / month</span><b class="num">${fmt0(mins)}</b></div><div class="stat ok"><span class="caps">Paid off so far</span><b class="num">${fmt0(Math.max(0, orig - total))}</b></div><div class="stat p"><span class="caps">Interest left</span><b class="num">${plan.interest === Infinity ? "∞" : fmt0(plan.interest)}</b></div></div></div>
    <div class="col"><div class="card"><div class="cardhead"><h2>Payoff order</h2><span class="tiny muted">extra goes to #1</span></div><div class="list">${list}</div><div class="sub" style="margin-top:10px">Minimum payments show up in Bills by themselves and are held back from your daily number – so a payment never surprises you.</div></div>${paidOff.length ? `<div class="card"><h2>Paid off 🕊️</h2>${paidOff.map(d => `<div class="item"><span class="grow done">${esc(d.name)}</span><span class="badge ok">gone</span><button class="iconbtn" data-act="editDebt" data-id="${d.id}" aria-label="Edit ${esc(d.name)}">${ic("edit")}</button></div>`).join("")}</div>` : ""}</div></div>`
      : `<div class="card"><div class="empty">Add a credit card, loan or buy-now-pay-later and see your debt-free date. Slide the extra payment to watch it move.</div></div>`);
}

// =========================================================== COOL-OFF LIST
function vWish() {
  const hrs = S.settings.cool || 48;
  const active = S.wish.filter(w => !w.done).sort((a, b) => a.ts - b.ts), past = S.wish.filter(w => w.done).sort((a, b) => b.doneTs - a.doneTs).slice(0, 12);
  const card = w => { const left = w.ts + hrs * 36e5 - now(), ready = left <= 0; const h = Math.ceil(left / 36e5);
    return `<div class="card ${ready ? "" : "flat"}" style="${ready ? "border-left:4px solid var(--deep)" : ""}"><div class="row sb top"><div><h3>${esc(w.name)}</h3><div class="num" style="margin-top:2px">${fmt(w.price)}</div></div><span class="badge ${ready ? "" : "warn"}">${ready ? "ready to decide" : (h > 24 ? Math.ceil(h / 24) + " days" : h + " h") + " to go"}</span></div>${w.why ? `<div class="sub" style="margin-top:6px">“${esc(w.why)}”</div>` : ""}
    <div class="bar" style="margin-top:12px"><i style="width:${clamp(1 - left / (hrs * 36e5), 0, 1) * 100}%"></i></div>
    <div class="row wrap" style="margin-top:12px;gap:8px">${ready ? `<button class="btn pri sm" data-act="wishBuy" data-id="${w.id}">I still want it</button><button class="btn sm" data-act="wishSkip" data-id="${w.id}">Let it go 🫧</button>` : `<button class="btn sm" data-act="wishSkip" data-id="${w.id}">Let it go now</button>`}<button class="iconbtn" data-act="wishDel" data-id="${w.id}" aria-label="Remove ${esc(w.name)}">${ic("trash")}</button></div></div>`; };
  return pageTop("Something caught your eye?", "Cool-off list", `<button class="btn pri" data-act="newWish">${ic("plus")} Park something</button>`)
    + `<div class="stats" style="margin-bottom:18px"><div class="stat ok"><span class="caps">Kept by waiting</span><b class="num">${fmt(S.kept)}</b></div><div class="stat"><span class="caps">Cooling off</span><b>${active.length}</b></div><div class="stat p"><span class="caps">Cool-off time</span><b>${hrs < 24 ? hrs + " h" : hrs / 24 + " day" + (hrs > 24 ? "s" : "")}</b></div></div>
    <div class="grid g2"><div class="col">${active.length ? active.map(card).join("") : `<div class="card"><div class="empty">Want something right now? Park it here instead of buying. After the cool-off, Haven asks if you still want it – often you won't, and that money stays yours.</div></div>`}</div>
    <div class="col"><div class="card"><h2>How it works</h2><div class="list" style="margin-top:8px"><div class="item"><div class="emo">1</div><span>Park it: what, how much, what it would add to your life.</span></div><div class="item"><div class="emo">2</div><span>Wait ${hrs < 24 ? hrs + " hours" : hrs / 24 + " days"}. The urge usually fades.</span></div><div class="item"><div class="emo">3</div><span>Still want it? Buy it guilt-free. Let it go? It counts as kept.</span></div></div><div class="row" style="margin-top:12px"><span class="small muted grow">Cool-off time</span><div class="seg">${[24, 48, 72, 168].map(h => `<button class="${hrs === h ? "on" : ""}" data-act="cool" data-h="${h}">${h < 168 ? h + "h" : "7d"}</button>`).join("")}</div></div></div>
    ${past.length ? `<div class="card"><h2>Decided</h2><div class="list" style="margin-top:6px">${past.map(w => `<div class="item"><span class="grow ${w.done === "skip" ? "" : "muted"}">${esc(w.name)}</span><span class="badge ${w.done === "skip" ? "ok" : ""}">${w.done === "skip" ? "kept " + fmt0(w.price) : "bought"}</span></div>`).join("")}</div></div>` : ""}</div></div>`;
}

// =========================================================== INSIGHTS
function vInsights() {
  const t = today(), first = E.monthStart(t), pf = E.addMonths(first, -1, 1), pl = E.addDays(first, -1);
  const sum = (a, b) => S.expenses.filter(e => e.date >= a && e.date <= b).reduce((s, e) => s + (+e.amount), 0);
  const thisM = sum(first, t), sameDayLast = sum(pf, E.addMonths(t, -1)), lastM = sum(pf, pl);
  const days = Array.from({ length: 30 }, (_, i) => E.addDays(t, i - 29)), vals = days.map(d => sum(d, d));
  const avg = vals.reduce((a, v) => a + v, 0) / 30;
  const bydow = [0, 0, 0, 0, 0, 0, 0]; S.expenses.filter(e => E.diff(e.date, t) < 90).forEach(e => bydow[E.dow(e.date)] += +e.amount);
  const topDow = bydow.indexOf(Math.max(...bydow));
  const big = S.expenses.filter(e => e.date >= first).sort((a, b) => b.amount - a.amount).slice(0, 5);
  const subs = S.bills.filter(b => b.kind === "sub" && !b.off).reduce((a, b) => a + E.perMonth(b), 0);
  const ns = Object.keys(S.nospend).filter(d => S.nospend[d] && d >= first).length;
  const earned = Object.keys(MILESTONES).map(k => [k, ...MILESTONES[k], S.milestones[k]]);
  const diffPct = sameDayLast ? Math.round((thisM - sameDayLast) / sameDayLast * 100) : null;
  return pageTop("Patterns, gently", "Insights", "")
    + `<div class="stats" style="margin-bottom:18px"><div class="stat p"><span class="caps">Spent this month</span><b class="num">${fmt0(thisM)}</b></div><div class="stat ${diffPct !== null && diffPct > 0 ? "warn" : "ok"}"><span class="caps">vs. same point last month</span><b>${diffPct === null ? "–" : (diffPct > 0 ? "+" : "") + diffPct + "%"}</b></div><div class="stat"><span class="caps">Average a day</span><b class="num">${fmt0(avg)}</b></div><div class="stat ok"><span class="caps">No-spend days</span><b>${ns} ★</b></div></div>
    <div class="grid g2"><div class="col"><div class="card"><div class="cardhead"><h2>Last 30 days</h2><span class="tiny muted">daily spending</span></div>${bars(vals, [dshort(days[0]), dshort(days[15]), "today"], 130, "var(--deep)", 29)}</div>
    <div class="card"><div class="cardhead"><h2>Biggest spends this month</h2></div>${big.length ? `<div class="list">${big.map(expRow).join("")}</div>` : `<div class="empty">Nothing yet.</div>`}</div></div>
    <div class="col"><div class="card"><h2>Little things we noticed</h2><div class="list" style="margin-top:8px">
      ${bydow.some(v => v) ? `<div class="item"><div class="emo">📅</div><span class="grow">${DOWL[topDow]}s are your biggest spending day lately.</span></div>` : ""}
      <div class="item"><div class="emo">📺</div><span class="grow">Subscriptions cost you ${fmt(subs)} a month – ${fmt0(subs * 12)} a year.</span></div>
      <div class="item"><div class="emo">🫙</div><span class="grow">You kept ${fmt(S.kept)} by waiting before buying${S.rescued ? ` and rescued ${fmt(S.rescued)} of leftovers into goals` : ""}.</span></div>
      <div class="item"><div class="emo">🗓️</div><span class="grow">Last month you spent ${fmt0(lastM)} on everyday things.</span></div></div></div>
    <div class="card"><div class="cardhead"><h2>Milestones</h2><span class="tiny muted">no streaks, just moments</span></div><div class="list">${earned.map(([k, e, n, d, when]) => `<div class="item" style="${when ? "" : "opacity:.45"}"><div class="emo">${e}</div><div class="grow"><b>${n}</b><div class="tiny muted">${when ? "reached " + dshort(when) : d}</div></div>${when ? `<span class="badge ok">✓</span>` : ""}</div>`).join("")}</div></div></div></div>`;
}

// ------------------------------------------------------------ leftover rescue
function leftoverCard(s) {
  if (S.settings.smooth === false || !s.periodStart || s.cushion < Math.max(20, (s.plan || 0) * 2)) return "";
  if ((S.cushionAck || {})[s.periodStart]) return "";

function detectiveModal() {
  const m = modal("Subscription detective", `<p style="margin-top:0">Export a CSV of the last 2–3 months from your online banking and drop it here. Haven looks for things that repeat every month – and for fees you might not have noticed.</p>
    <label class="empty" style="display:block;cursor:pointer"><input type="file" id="csvFile" accept=".csv,text/csv,.txt" class="hidden">📄 Choose a CSV file</label>
    <div class="sub tiny" style="margin-top:10px">🔒 The file is read on this device only. Nothing is uploaded or stored.</div><div id="detOut"></div>`, "", { wide: true });
  m.querySelector("#csvFile").addEventListener("change", ev => { const f = ev.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => detect(String(r.result), m); r.readAsText(f); });
}
function parseCSV(text) {
  const first = text.split(/\r?\n/).find(l => l.trim()) || "";
  const dl = [";", "\t", ",", "|"].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true; else if (ch === dl) { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); if (row.some(c => c.trim())) rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  row.push(cell); if (row.some(c => c.trim())) rows.push(row);

}

}
function detect(text, m) {

    const body = rows.slice(Math.max(0, head)), width = Math.max(...body.map(r => r.length));
    const colScore = (fn) => Array.from({ length: width }, (_, j) => body.filter(r => fn(r[j] || "")).length);
    const dScore = colScore(c => parseDate(c)), dCol = dScore.indexOf(Math.max(...dScore));
    const isNum = c => /^[-+−(]?\s*[^\d\s]{0,4}\s*[\d'.,]+\)?\s*[^\d\s]{0,4}$/.test(c.trim()) && /\d/.test(c);
    const nScore = colScore(isNum); nScore[dCol] = -1;
    const numCols = nScore.map((v, j) => [v, j]).filter(x => x[0] >= body.length * .3).map(x => x[1]);
    const tScore = Array.from({ length: width }, (_, j) => j === dCol || numCols.includes(j) ? -1 : body.reduce((a, r) => a + ((r[j] || "").replace(/[\d\W]/g, "").length), 0));
    const tCol = tScore.indexOf(Math.max(...tScore));
    // day/month order: if any first part > 12 → it's the day
    const dm = body.map(r => parseDate(r[dCol] || "")).filter(Boolean);
    const dayFirst = dm.some(d => d[3] === "amb" && d[4] > 12) || (!dm.some(d => d[3] === "amb" && d[5] > 12) && (!/^\d{1,2}\/\d{1,2}\/\d{2,4}/.test(body[0][dCol] || "") || !["USD", "CAD"].includes(cur())));
    const tx = [];
    body.forEach(r => {
      const d = parseDate(r[dCol] || ""); if (!d) return;
      const date = d[3] === "amb" ? (dayFirst ? `${d[0]}-${E.pad(d[5])}-${E.pad(d[4])}` : `${d[0]}-${E.pad(d[4])}-${E.pad(d[5])}`) : `${d[0]}-${E.pad(d[1])}-${E.pad(d[2])}`;
      let amt = null;
      if (numCols.length === 1) { const raw = r[numCols[0]] || ""; amt = num(raw.replace("−", "-")); if (/^\(.*\)$/.test(raw.trim())) amt = -Math.abs(amt); }
      else if (numCols.length >= 2) { const vals = numCols.map(j => num((r[j] || "").replace("−", "-"))); const nz = vals.filter(v => v); amt = nz.length === 1 ? (vals[0] ? -Math.abs(vals[0]) : Math.abs(vals[1])) : nz.find(v => v < 0) ?? nz[0] ?? 0; }
      if (!amt) return;

    const neg = tx.filter(t => t.amt < 0).length >= tx.length * .3;      // outflows are negative in most exports
    const outs = tx.map(t => ({ ...t, out: neg ? -t.amt : t.amt })).filter(t => t.out > 0);
    const norm = d => d.toLowerCase().replace(/\d{3,}|\b\d+\b|[*#_]|x{3,}/g, " ").replace(/\b(card|purchase|payment|pos|debit|visa|mastercard|recurring|ref|online|www|com)\b/g, " ").replace(/[^a-z& ]/g, " ").replace(/\s+/g, " ").trim().split(" ").slice(0, 3).join(" ");
    const groups = {}; outs.forEach(t => { const k = norm(t.desc); if (k.length < 3) return; (groups[k] = groups[k] || []).push(t); });
    const KNOWN = /netflix|spotify|disney|hulu|max|hbo|apple|icloud|google|youtube|amazon prime|prime video|audible|patreon|adobe|microsoft|xbox|playstation|nintendo|dropbox|canva|chatgpt|openai|duolingo|headspace|calm|gym|fitness|peloton|onlyfans|twitch|paramount|peacock|crunchyroll|dazn|sky|deezer|tidal/;
    const FEES = /fee|overdraft|late charge|late payment|interest charge|foreign transaction|atm|penalty|nsf|returned item|maintenance|gebühr|frais/;
    const subs = [], fees = [];
    Object.entries(groups).forEach(([k, list]) => {
      const months = new Set(list.map(t => t.date.slice(0, 7))).size;
      const amts = list.map(t => t.out), avg = amts.reduce((a, v) => a + v, 0) / amts.length;

    });

    const dates = tx.map(t => t.date).sort(), spanM = Math.max(1, E.diff(dates[0], dates[dates.length - 1]) / 30.4);

// next charge of every subscription (overdue first, then upcoming)
function subList() {
  const t = today(), occs = E.billOcc(S, E.addDays(t, -31), E.addDays(t, 400));
  const out = [];
  S.bills.filter(b => b.kind === "sub" && !b.off).forEach(b => {
    const o = occs.find(x => x.bill.id === b.id && !(b.added && x.date < b.added) && (x.date >= t || (!x.paid && !x.auto)));
    out.push({ b, o, year: E.perMonth(b) * 12 });
  });
  return out.sort((a, c) => (a.o ? a.o.date : "9999") < (c.o ? c.o.date : "9999") ? -1 : 1);
}
function cancelSoon() { // subscriptions with a cancel-by date within 7 days (or just passed, still unpaid this round)
  const t = today();
  return S.bills.filter(b => b.kind === "sub" && !b.off && b.cancelBy && E.diff(t, b.cancelBy) >= 0 && E.diff(t, b.cancelBy) <= 7);
}
function weekLine() {
  const t = today(), o = E.billOcc(S, t, E.addDays(t, 6)).filter(x => !x.paid && !(x.bill.added && x.date < x.bill.added));
  if (!o.length) return "";
  return `<div class="sub" style="margin:-4px 0 10px">This week: <b>${o.length} bill${o.length > 1 ? "s" : ""}</b> · <b class="num">${fmt(o.reduce((a, x) => a + (+x.bill.amount), 0))}</b></div>`;
}
function subRow(x) {
  const t = today(), b = x.b, o = x.o;
  let st = "";
  if (o) {
    const d = E.diff(t, o.date), late = d < 0 && !o.paid && !o.auto;
    st = o.paid ? `<span class="badge ok">paid</span>` : late ? `<span class="badge bad">overdue</span>` : o.auto && d <= 0 ? `<span class="badge ok">autopay</span>` : `<span class="badge ${d <= 3 ? "warn" : ""}">${d === 0 ? "today" : d === 1 ? "tomorrow" : "in " + d + " days"}</span>`;
  }
  const cb = b.cancelBy ? (() => { const d = E.diff(t, b.cancelBy); return `<span class="badge ${d < 0 ? "" : d <= 14 ? "warn" : ""}">${d < 0 ? "cancel date passed" : d === 0 ? "cancel by today" : "cancel by " + dshort(b.cancelBy)}</span>`; })() : "";
  const up = b.priceFrom && +b.priceFrom < +b.amount ? `<span class="badge warn">↑ was ${fmt(b.priceFrom)}</span>` : b.priceFrom && +b.priceFrom > +b.amount ? `<span class="badge ok">↓ was ${fmt(b.priceFrom)}</span>` : "";
  return `<div class="item">${o ? dateBox(o.date, o.paid || (o.auto && o.date <= t) ? "ok" : E.diff(t, o.date) < 0 ? "bad" : E.diff(t, o.date) <= 3 ? "warn" : "") : `<div class="emo">${b.emoji || "📺"}</div>`}
    <div class="grow"><b class="${o && o.paid ? "done" : ""}">${b.emoji ? b.emoji + " " : ""}${esc(b.name)}</b><div class="row wrap tiny muted" style="gap:6px;margin-top:2px">${st}${cb}${up}<span>${FREQ[b.freq] || ""}${b.autopay ? " · autopay" : ""}</span></div></div>
    <div style="text-align:right"><span class="amt">${fmt(b.amount)}</span><div class="tiny muted num">${fmt0(x.year)} / yr</div></div>
    ${o && !b.autopay ? `<button class="check ${o.paid ? "on" : ""}" data-act="pay" data-k="${esc(o.key)}" aria-label="Mark ${esc(b.name)} paid">${ic("check")}</button>` : ""}<button class="iconbtn" data-act="editBill" data-id="${b.id}" aria-label="Edit ${esc(b.name)}">${ic("edit")}</button></div>`;
}
function vSubs() {

      <div class="sub" style="margin-top:10px">${top && top.year > 0 ? `${esc(top.b.name)} is your biggest one – ${fmt0(top.year)} a year. ` : ""}Cancelling one you forgot about is the easiest money you'll find this month.</div></div>
    <div class="card"><h2>Never look it up again</h2><div class="sub" style="margin:4px 0 10px">Add each subscription once. Haven repeats it, holds the money back and puts it in “Looking ahead”. Set a <b>cancel-by date</b> for free trials and yearly plans, and get a reminder a week before.</div><button class="btn sm" data-act="ics">${ic("cal")} Put them in my calendar</button></div></div></div>`
      : `<div class="card"><div class="empty">No subscriptions yet. Add Netflix, Spotify, your phone plan… once, and Haven shows when each one hits and what it costs you a year.<div style="margin-top:12px" class="row wrap"><button class="btn pri sm" data-act="newSub">${ic("plus")} Add one</button><button class="btn sm" data-act="detective">🔎 Find forgotten ones</button></div></div></div>`);
}

const fld = (label, inner, help = "") => `<div class="field"><label>${label}</label>${inner}${help ? `<span class="help">${help}</span>` : ""}</div>`;
const inp = (name, val = "", attrs = "") => `<input class="inp" name="${name}" value="${esc(val)}" ${attrs}>`;
const money = (name, val = "", attrs = "") => inp(name, val === "" ? "" : val, `inputmode="decimal" placeholder="0.00" ${attrs}`);
const sel = (name, opts, val) => `<select class="inp" name="${name}">${opts.map(([v, l]) => `<option value="${v}" ${String(v) === String(val) ? "selected" : ""}>${l}</option>`).join("")}</select>`;
const num = v => {
  let s = String(v ?? "").replace(/[^0-9.,-]/g, "");
  const lc = s.lastIndexOf(","), ld = s.lastIndexOf(".");
  if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");   // 1.234,56 or 1,234.56
  else if (lc > -1) s = /,\d{1,2}$/.test(s) && s.split(",").length === 2 ? s.replace(",", ".") : s.replace(/,/g, "");
  else if ((s.match(/\./g) || []).length > 1 || /^-?\d{1,3}\.\d{3}$/.test(s)) s = s.replace(/\./g, "");    // 1.234.567 / 1.234
  const n = parseFloat(s); return isFinite(n) ? Math.round(n * 100) / 100 : 0;
};
function form(m) { const o = {}; m.querySelectorAll("[name]").forEach(e => o[e.name] = e.type === "checkbox" ? e.checked : e.value); return o; }
const FREQ_OPTS = Object.entries(FREQ).map(([k, v]) => [k, v[0].toUpperCase() + v.slice(1)]);

// ------------------------------------------------------------ add / edit spend (keypad)
function addSpend(pre = {}) {
  let val = pre.amount ? String(pre.amount) : "", cat = pre.cat || (S.cats[0] && S.cats[0].id), date = pre.date || today();
  const isEdit = !!pre.id;
  const m = modal(isEdit ? "Edit spend" : "Log a spend", `
    <div class="amountview"><div class="v num" id="kv"></div><button class="link" data-k="type">type it instead</button><input class="inp hidden" id="ktype" inputmode="decimal" style="margin-top:8px;text-align:center"></div>
    <div class="plus">${[1, 5, 10, 20].map(n => `<button data-k="+${n}">+${symbol()}${n}</button>`).join("")}</div>
    <div class="keys">${["1", "2", "3", "4", "5", "6", "7", "8", "9", curDigits() ? "." : "00", "0", "⌫"].map(k => `<button data-k="${k}" aria-label="${k === "⌫" ? "Delete" : k === "." ? "Decimal point" : k}">${k}</button>`).join("")}</div>
    <div class="cats" id="kcats">${S.cats.map(c => `<button class="cat ${c.id === cat ? "on" : ""}" data-c="${c.id}">${c.emoji} ${esc(c.name)}</button>`).join("")}</div>
    <div class="frow" style="margin-top:10px">${fld("Note (optional)", inp("note", pre.note || "", 'placeholder="coffee with Sam"'))}${fld("Date", `<input class="inp" type="date" name="date" value="${date}" max="${E.addDays(today(), 60)}">`)}</div>
    <label class="row small muted" style="gap:8px"><input type="checkbox" name="refund" ${pre.amount < 0 ? "checked" : ""}> This is a refund (money back)</label>`,
    `${isEdit ? `<button class="btn danger" data-k="del">${ic("trash")}</button>` : `<button class="btn" data-k="another">Save & add another</button>`}<button class="btn pri" data-k="save">${isEdit ? "Save" : "Add spend"}</button>`);
  if (pre.amount < 0) val = String(-pre.amount);
  if (val && val.includes(".")) val = (+val).toFixed(2);
  const kv = $("#kv", m), kt = $("#ktype", m);
  const show = () => { kv.innerHTML = `<span>${esc(symbol())}</span>${val || "0"}`; };
  show();
  const finish = again => {
    const f = form(m), amt = num(kt.classList.contains("hidden") ? val : kt.value);
    if (!amt) { toast("Type an amount first."); return; }
    const a = f.refund ? -Math.abs(amt) : Math.abs(amt);
    if (isEdit) { const e = S.expenses.find(x => x.id === pre.id); Object.assign(e, { amount: a, cat, note: f.note.trim(), date: f.date || today() }); commit(); closeModal(); toast("Saved."); return; }
    const e = { id: uid(), amount: a, cat, note: f.note.trim(), date: f.date || today(), ts: now() };
    if (pre.onSave) pre.onSave(e);
    S.expenses.push(e); if (S.nospend[e.date]) delete S.nospend[e.date];
    tickMinute("spend"); commit(); milestone("firstSpend"); weekCheck();
    toast(`${fmt(Math.abs(a))} ${a < 0 ? "refund" : catOf(cat).name.toLowerCase()} logged`, () => commit(() => S.expenses = S.expenses.filter(x => x.id !== e.id)));
    if (again) { closeModal(); addSpend({ cat, date: f.date }); } else closeModal();
  };
  m.addEventListener("click", ev => {
    const b = ev.target.closest("[data-k],[data-c]"); if (!b) return;
    if (b.dataset.c) { cat = b.dataset.c; m.querySelectorAll(".cat").forEach(x => x.classList.toggle("on", x === b)); return; }
    const k = b.dataset.k;
    if (k === "save") return finish(false); if (k === "another") return finish(true);
    if (k === "del") { const e = S.expenses.find(x => x.id === pre.id); commit(() => S.expenses = S.expenses.filter(x => x.id !== pre.id)); closeModal(); toast("Deleted.", () => commit(() => S.expenses.push(e))); return; }
    if (k === "type") { kt.classList.remove("hidden"); kt.value = val; kt.focus(); kv.parentNode.querySelector(".link").classList.add("hidden"); return; }
    if (k === "⌫") val = val.slice(0, -1);
    else if (k[0] === "+") val = String(Math.round((num(val) + +k.slice(1)) * 100) / 100);
    else if (k === ".") { if (!val.includes(".")) val = (val || "0") + "."; }
    else if (k === "00") { if (val) val += "00"; }
    else if (/\d/.test(k)) { if (/\.\d\d$/.test(val)) return; val = val === "0" ? k : val + k; }
    if (val.length > 9) val = val.slice(0, 9);
    show();
  });
  kt.addEventListener("keydown", e => { if (e.key === "Enter") finish(false); });
  const kh = e => {
    if (!m.isConnected) return document.removeEventListener("keydown", kh);
    if (e.target.closest("input,select,textarea") || e.metaKey || e.ctrlKey) return;
    const map = { Backspace: "⌫", ",": ".", ".": "." };
    const k = /^\d$/.test(e.key) ? e.key : map[e.key];
    if (e.key === "Enter") { e.preventDefault(); return finish(false); }
    if (k) { e.preventDefault(); m.querySelector(`.keys [data-k="${k}"]`).click(); }
  };
  document.addEventListener("keydown", kh);
}
function quickAdd(i) {
  const q = S.settings.quick[i]; if (!q) return;

  const t = today(), payToday = E.payOcc(S, t, t).reduce((a, p) => a + p.amount, 0);

  const m = modal(title || "What does your bank say?", `<div class="sub" style="margin-bottom:14px">Open your banking app and type what's in your <b>everyday</b> account(s) right now. Savings you don't spend from can stay out.</div>

    ${payToday ? `<label class="row small" style="gap:8px;margin-top:14px"><input type="checkbox" name="paidin" ${pend ? "" : "checked"}> Today's pay (${fmt(payToday)}) is already in this balance</label>` : ""}

    `<button class="btn pri" data-k="save">Update my number</button>`);
  const collect = () => { m.querySelectorAll("[data-name]").forEach(i => accs[+i.dataset.name].name = i.value.slice(0, 30) || "Account"); accs.forEach((a, i) => a.val = m.querySelector(`[name="acc_${i}"]`).value); const pi = m.querySelector('[name="paidin"]'); accs.pend = pi ? !pi.checked : false; };

// ------------------------------------------------------------ files: backup, restore, calendar
function download(name, text, type) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function backup() { if (DEMO) return toast("Backups work in the full app."); S.lastBackup = today(); save(); download(`haven-backup-${today()}.json`, JSON.stringify(S), "application/json"); toast("Backup downloaded. Keep it somewhere safe (Files, Drive, email to yourself)."); }
function restore(file) {
  const r = new FileReader();
  r.onload = () => { let d; try { d = JSON.parse(r.result); if (!d || !d.settings || !Array.isArray(d.expenses)) throw 0; d = migrate(d); } catch (e) { return toast("That file isn't a Haven backup."); } if (!confirm("Replace everything on this device with the backup?")) return; S = d; S.setup = true; S.lastOpen = today(); flush(); render(); toast("Restored. Welcome back! ✨"); $("#restoreFile").value = ""; };
  r.readAsText(file);
}
function ics() {
  const bills = E.allBills(S).filter(b => b.freq !== "once" || b.start >= today());
  if (!bills.length && !(S.remember || []).some(r => !r.done)) return toast("Add a bill first.");
  const rr = { weekly: "FREQ=WEEKLY", biweekly: "FREQ=WEEKLY;INTERVAL=2", "4weekly": "FREQ=WEEKLY;INTERVAL=4", monthly: "FREQ=MONTHLY", quarterly: "FREQ=MONTHLY;INTERVAL=3", yearly: "FREQ=YEARLY" };
  const st = b => b.kind === "debt" ? E.occ(b, today(), E.addDays(today(), 40))[0] || today() : b.start;
  const icsEsc = s => String(s).replace(/\\/g, "\\\\").replace(/([,;])/g, "\\$1").replace(/\n/g, "\\n");
  const dayRule = ds => { ds = [...new Set(ds)].sort((a, b) => a - b); const hi = ds[ds.length - 1];
    if (hi <= 28) return "BYMONTHDAY=" + ds.join(","); if (hi === 31) return "BYMONTHDAY=" + ds.map(d => d === 31 ? -1 : d).join(",");
    const lo = ds.length > 1 ? ds[0] : null, tail = []; for (let d = 28; d <= hi; d++) tail.push(d);
    return `BYMONTHDAY=${[lo, ...tail].filter(x => x !== null).join(",")};BYSETPOS=${lo !== null ? "1,-1" : "-1"}`; };
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//TrueHavenStudios//Haven//EN", "CALSCALE:GREGORIAN"];
  bills.forEach(b => {
    const d = st(b).replace(/-/g, ""), nx = E.addDays(st(b), 1).replace(/-/g, "");
    lines.push("BEGIN:VEVENT", `UID:${b.id}@haven`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").slice(0, 15)}Z`, `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${nx}`, "SUMMARY:" + icsEsc(`${b.emoji ? b.emoji + " " : ""}${b.name} · ${fmt(b.amount)}`), "DESCRIPTION:From your Haven budget planner");
    const day = E.pd(st(b)).getDate();
    if (b.freq === "semimonthly") { const d1 = E.pd(b.start).getDate(), d2 = b.day2 || (d1 <= 15 ? d1 + 15 : d1 - 15); lines.push(`RRULE:FREQ=MONTHLY;${dayRule([d1, d2])}`); }
    else if ((b.freq === "monthly" || b.freq === "quarterly") && day >= 29) lines.push(`RRULE:${rr[b.freq]};${dayRule([day])}`);
    else if (rr[b.freq]) lines.push("RRULE:" + rr[b.freq]);
    lines.push("BEGIN:VALARM", "TRIGGER:-PT15H", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(`${b.name} is due tomorrow`), "END:VALARM", "END:VEVENT");
  });
  (S.remember || []).filter(r => !r.done && r.date && r.date >= today()).forEach(r => {
    const T = RT[r.type] || RT.other, d = r.date.replace(/-/g, ""), nx = E.addDays(r.date, 1).replace(/-/g, "");
    lines.push("BEGIN:VEVENT", `UID:${r.id}@haven`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").slice(0, 15)}Z`, `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${nx}`, "SUMMARY:" + icsEsc(`${T[0]} ${T[1]}: ${r.name}`), "BEGIN:VALARM", "TRIGGER:-P2D", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(`${r.name} – in 2 days`), "END:VALARM", "END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  download("haven-bills.ics", lines.join("\r\n"), "text/calendar");
  toast("Open the file to add your bills to Apple, Google or Outlook calendar – with a reminder the evening before.");
}

  reset: () => { if (!confirm("Erase everything on this device? This can't be undone. (Download a backup first?)")) return; S = blank(); ob = { step: 0, bills: [] }; commit(); go("today"); },
  obTheme: b => { S.settings.theme = b.dataset.t; obCollect(); render(); }, obNext: () => { obCollect(); ob.step++; render(); }, obBack: () => { obCollect(); ob.step--; render(); }, obSkip: () => { ob.step++; render(); },
  obBill: b => { obCollect(); const n = b.dataset.n, c = COMMON.find(x => x[0] === n); const i = ob.bills.findIndex(x => x.name === n); if (i >= 0) ob.bills.splice(i, 1); else ob.bills.push({ name: n, emoji: c[1], amount: c[2], day: 1 }); render(); },
  obDone: obFinish,
  ...FEAT_ACT, ...SUBS_ACT
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  if (b.tagName === "A" && b.getAttribute("href") === "javascript:void 0") e.preventDefault();
  if (b.dataset.act !== "close" && b.closest(".modal") && !["pay"].includes(b.dataset.act)) closeModal();
  if (b.dataset.act === "pay" && b.closest(".modal")) { const was = !!S.paid[b.dataset.k]; if (was) delete S.paid[b.dataset.k]; else { S.paid[b.dataset.k] = now(); milestone("firstPaid"); } save(); b.classList.toggle("on", !was); return; }
  f(b, e);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "impulse") { const o = $("#impulseOut"); if (o) o.innerHTML = impulseResult(num(t.value)); return; }
  if (t.dataset.act === "extra") { viewState.extra = +t.value; S.settings.debtExtra = +t.value; save(); const y = window.scrollY; render(); window.scrollTo(0, y); const r = document.querySelector('[data-act="extra"]'); if (r) r.focus(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.set) { S.settings[t.dataset.set] = t.value; commit(); }
  if (t.id === "restoreFile" && t.files[0]) restore(t.files[0]);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); if ((e.key === "n" || e.key === "+") && !e.target.closest("input,select,textarea") && !document.querySelector(".scrim") && S.setup) { e.preventDefault(); addSpend(); } });

// ------------------------------------------------------------ boot
function boot() {
  applyTheme(); render();
  if (loadProblem) setTimeout(() => toast(loadProblem), 400);
  const t = today();
  if (S.setup && !DEMO) {
    const away = E.diff(S.lastOpen || t, t);
    if (away >= 4 && S.balance.ts) setTimeout(() => welcomeBack(away), 350);
    S.holds = S.holds.filter(h => h.until > t);
    S.lastOpen = t; save();
  }
  if ("serviceWorker" in navigator && location.protocol === "https:" && !window.HAVEN_NO_SW && !DEMO) navigator.serviceWorker.register("sw.js").catch(() => { });
  // the day rolls over while the app stays open
  let lastDay = t; setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) rerender(); });
}
boot();
</script>
